<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tukang Sayur Online</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- MudBlazor Stylesheet -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0;">

    <div id="app">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: #38bdf8;">
            <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 12px;">🥬 Tukang Sayur Online</div>
            <div style="font-size: 0.95rem; color: #94a3b8;">Memuat aplikasi...</div>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, line, col, error) {
            var app = document.getElementById('app');
            if (app) {
                app.innerHTML = '<div style="padding:24px; color:#f87171; background:#0f172a; min-height:100vh;">' +
                    '<h3 style="color:#ef4444; margin-top:0;">⚠️ JavaScript Startup Error:</h3>' +
                    '<pre style="white-space:pre-wrap; word-break:break-all; color:#fca5a5; font-size:13px;">' + msg + '\nURL: ' + url + '\nLine: ' + line + '</pre></div>';
            }
        };
        window.getGPSCoordinates = function () {
            return new Promise(function (resolve, reject) {
                if (!navigator.geolocation) {
                    reject("Perangkat ini tidak mendukung fitur GPS.");
                } else {
                    navigator.geolocation.getCurrentPosition(
                        function (pos) {
                            resolve({
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude
                            });
                        },
                        function (err) {
                            var msg = "Gagal mendapatkan GPS: ";
                            if (err.code === 1) msg += "Izin akses lokasi (GPS) ditolak.";
                            else if (err.code === 2) msg += "Sinyal lokasi tidak tersedia.";
                            else if (err.code === 3) msg += "Waktu deteksi GPS habis.";
                            else msg += err.message;
                            reject(msg);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                }
            });
        };
        window.openMapUrl = function (url) {
            try {
                window.location.href = url;
            } catch (e) {
                window.open(url, '_blank');
            }
        };
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
